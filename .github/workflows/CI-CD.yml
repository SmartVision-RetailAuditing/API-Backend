name: Build Docker Image and Push to ACR (Acceptance, Development)

on:
  push:
    branches:
      - acceptance   # acceptance branch pushlanınca çalışır
      - development  # development branch pushlanınca çalışır

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Kodu çek
    - name: Checkout
      uses: actions/checkout@v4

    # 2. Azure login (ACCEPTANCE secrets)
    - name: Sign in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_ACCEPTANCE }}

    # 3. ACR login
    - name: Login to ACR
      uses: azure/docker-login@v2
      with:
        login-server: smartvisioncontainerregistery.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME_ACCEPTANCE }}
        password: ${{ secrets.REGISTRY_PASSWORD_ACCEPTANCE }}

    # 4. Docker build & push
    - name: Build and Push Image
      run: |
        docker build . -t smartvisioncontainerregistery.azurecr.io/smartvision-api:${{ github.sha }}
        docker push smartvisioncontainerregistery.azurecr.io/smartvision-api:${{ github.sha }}

    # 5. Deploy to App Service (Acceptance)
    - name: Deploy to App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'smartvisionbackend'  # acceptance app adı
        images: 'smartvisioncontainerregistery.azurecr.io/smartvision-api:${{ github.sha }}'

    # 6. Logout
    - run: az logout
